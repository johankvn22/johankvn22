<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 850 130' width='850' height='130' fill='none'>
    <style>
        @keyframes flowLine {
            0% { stroke-dashoffset: 1200; }
            100% { stroke-dashoffset: -1200; }
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        @keyframes glowFooter {
            0% { opacity: 0.3; }
            50% { opacity: 0.65; }
            100% { opacity: 0.3; }
        }
        .quote-text {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            font-style: italic;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.3px;
        }
        .author-text {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>

    <defs>
        <linearGradient id='footerBg' x1='0%' y1='0%' x2='100%' y2='100%'>
            <stop offset='0%' stop-color='#0B0F19'/>
            <stop offset='50%' stop-color='#0F172A'/>
            <stop offset='100%' stop-color='#050811'/>
        </linearGradient>

        <linearGradient id='neonLineGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#38BDF8' stop-opacity='0'/>
            <stop offset='30%' stop-color='#38BDF8'/>
            <stop offset='70%' stop-color='#818CF8'/>
            <stop offset='100%' stop-color='#C084FC' stop-opacity='0'/>
        </linearGradient>

        <linearGradient id='quoteGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#FFFFFF'/>
            <stop offset='50%' stop-color='#E2E8F0'/>
            <stop offset='100%' stop-color='#94A3B8'/>
        </linearGradient>

        <radialGradient id='footerOrb' cx='50%' cy='50%' r='50%'>
            <stop offset='0%' stop-color='#38BDF8' stop-opacity='0.25'/>
            <stop offset='100%' stop-color='#38BDF8' stop-opacity='0'/>
        </radialGradient>

        <pattern id='footerGrid' width='25' height='25' patternUnits='userSpaceOnUse'>
            <circle cx='12.5' cy='12.5' r='0.6' fill='#334155' fill-opacity='0.35'/>
        </pattern>

        <clipPath id='footerClip'>
            <rect width='850' height='130' rx='16'/>
        </clipPath>
    </defs>

    <g clip-path='url(#footerClip)'>
        <!-- Background -->
        <rect width='850' height='130' fill='url(#footerBg)'/>
        <rect width='850' height='130' fill='url(#footerGrid)'/>

        <!-- Ambient Center Glow -->
        <ellipse cx='425' cy='65' rx='280' ry='50' fill='url(#footerOrb)' style='animation: glowFooter 6s ease-in-out infinite;'/>

        <!-- Animated Top Wave / Laser Line -->
        <path d='M 0 1 L 320 1 Q 370 1 390 12 Q 410 24 425 24 Q 440 24 460 12 Q 480 1 530 1 L 850 1' 
              fill='none' stroke='#1E293B' stroke-width='1'/>
        <path d='M 0 1 L 320 1 Q 370 1 390 12 Q 410 24 425 24 Q 440 24 460 12 Q 480 1 530 1 L 850 1' 
              fill='none' stroke='url(#neonLineGrad)' stroke-width='2' stroke-dasharray='160 500' style='animation: flowLine 8s linear infinite;'/>

        <!-- Center Tech Pulse Point -->
        <circle cx='425' cy='24' r='3.5' fill='#38BDF8'/>
        <circle cx='425' cy='24' r='7' fill='none' stroke='#38BDF8' stroke-width='1' opacity='0.7'/>

        <!-- Quote Icon & Text -->
        <g transform='translate(425, 68)'>
            <text x='0' y='0' text-anchor='middle' fill='url(#quoteGrad)' class='quote-text'>
                “Keep building, stay curious, and never stop learning.”
            </text>
        </g>

        <!-- Signature Sub-footer -->
        <g transform='translate(425, 102)'>
            <text x='-14' y='0' text-anchor='end' fill='#64748B' class='author-text'>DESIGNED &amp; CODED WITH</text>
            
            <!-- Animated Heart Icon -->
            <g transform='translate(-6, -9)'>
                <path d='M0,3 A3,3 0 0,1 6,3 A3,3 0 0,1 12,3 Q12,7 6,11 Q0,7 0,3 Z' fill='#EF4444' style='animation: pulseHeart 1.8s ease-in-out infinite; transform-origin: 6px 6px;'/>
            </g>
            
            <text x='18' y='0' text-anchor='start' fill='#64748B' class='author-text'>BY JOHAN KEVIN</text>
        </g>

        <!-- Outer Border -->
        <rect x='0.5' y='0.5' width='849' height='129' rx='16' fill='none' stroke='#1E293B' stroke-width='1'/>
    </g>
</svg>