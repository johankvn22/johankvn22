<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 850 160' width='850' height='160' fill='none'>
    <style>
        @keyframes ombakDriftFront {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850.00px); }
        }
        @keyframes ombakDriftMid {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850.00px); }
        }
        @keyframes ombakDriftBack {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850.00px); }
        }
        @keyframes sprayShimmer {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }
        .footer-quote {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            font-style: italic;
            font-weight: 500;
            font-size: 15.5px;
            letter-spacing: 0.3px;
            fill: #0284C7;
        }
        @media (prefers-color-scheme: dark) {
            .footer-quote {
                fill: #38BDF8;
            }
        }
    </style>

    <defs>
        <!-- Ocean Blue Gradients -->
        <linearGradient id='oceanDeepGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#023E68'/>
            <stop offset='50%' stop-color='#0369A1'/>
            <stop offset='100%' stop-color='#0284C7'/>
        </linearGradient>

        <linearGradient id='oceanMidGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#0284C7'/>
            <stop offset='50%' stop-color='#0EA5E9'/>
            <stop offset='100%' stop-color='#38BDF8'/>
        </linearGradient>

        <linearGradient id='oceanFrontGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#0284C7'/>
            <stop offset='40%' stop-color='#0EA5E9'/>
            <stop offset='80%' stop-color='#38BDF8'/>
            <stop offset='100%' stop-color='#7DD3FC'/>
        </linearGradient>

        <clipPath id='footerBounds'>
            <rect width='850' height='160' rx='8'/>
        </clipPath>
    </defs>

    <!-- Centered Quote Above the Waves -->
    <text x='425' y='32' text-anchor='middle' class='footer-quote'>
        “Keep building, stay curious, and never stop learning.”
    </text>

    <g clip-path='url(#footerBounds)'>
        <!-- LAYER 1: Deep Ocean Swell (Back - 22s slow loop) -->
        <g style='animation: ombakDriftBack 22s linear infinite;'>
