        </g>

        <!-- LAYER 2: Mid-Ocean Rolling Wave (Mid - 14s loop) -->
        <g style='animation: ombakDriftMid 14s linear infinite;'>
            <path d='M -270.0 175 L -270.0 102.0 C -199.2 110.5, -134.0 86.7, -77.3 70.7 C -54.7 61.9, -26.3 67.3, -34.8 83.3 C -43.3 95.2, -15.0 105.4, 13.3 102.0  C 84.2 110.5, 149.3 86.7, 206.0 70.7 C 228.7 61.9, 257.0 67.3, 248.5 83.3 C 240.0 95.2, 268.3 105.4, 296.7 102.0  C 367.5 110.5, 432.7 86.7, 489.3 70.7 C 512.0 61.9, 540.3 67.3, 531.8 83.3 C 523.3 95.2, 551.7 105.4, 580.0 102.0  C 650.8 110.5, 716.0 86.7, 772.7 70.7 C 795.3 61.9, 823.7 67.3, 815.2 83.3 C 806.7 95.2, 835.0 105.4, 863.3 102.0  C 934.2 110.5, 999.3 86.7, 1056.0 70.7 C 1078.7 61.9, 1107.0 67.3, 1098.5 83.3 C 1090.0 95.2, 1118.3 105.4, 1146.7 102.0  C 1217.5 110.5, 1282.7 86.7, 1339.3 70.7 C 1362.0 61.9, 1390.3 67.3, 1381.8 83.3 C 1373.3 95.2, 1401.7 105.4, 1430.0 102.0  C 1500.8 110.5, 1566.0 86.7, 1622.7 70.7 C 1645.3 61.9, 1673.7 67.3, 1665.2 83.3 C 1656.7 95.2, 1685.0 105.4, 1713.3 102.0  C 1784.2 110.5, 1849.3 86.7, 1906.0 70.7 C 1928.7 61.9, 1957.0 67.3, 1948.5 83.3 C 1940.0 95.2, 1968.3 105.4, 1996.7 102.0  L 1996.7 175 Z' fill='url(#oceanMidGrad)' opacity='0.85'/>
            <!-- Foam Crest for Mid Wave -->
            <path d='M -114.2 79.9 C -77.3 69.7, -54.7 60.5, -26.3 66.6 C -32.0 78.2, -37.7 88.4, -26.3 95.2  M 169.2 79.9 C 206.0 69.7, 228.7 60.5, 257.0 66.6 C 251.3 78.2, 245.7 88.4, 257.0 95.2  M 452.5 79.9 C 489.3 69.7, 512.0 60.5, 540.3 66.6 C 534.7 78.2, 529.0 88.4, 540.3 95.2  M 735.8 79.9 C 772.7 69.7, 795.3 60.5, 823.7 66.6 C 818.0 78.2, 812.3 88.4, 823.7 95.2  M 1019.2 79.9 C 1056.0 69.7, 1078.7 60.5, 1107.0 66.6 C 1101.3 78.2, 1095.7 88.4, 1107.0 95.2  M 1302.5 79.9 C 1339.3 69.7, 1362.0 60.5, 1390.3 66.6 C 1384.7 78.2, 1379.0 88.4, 1390.3 95.2  M 1585.8 79.9 C 1622.7 69.7, 1645.3 60.5, 1673.7 66.6 C 1668.0 78.2, 1662.3 88.4, 1673.7 95.2  M 1869.2 79.9 C 1906.0 69.7, 1928.7 60.5, 1957.0 66.6 C 1951.3 78.2, 1945.7 88.4, 1957.0 95.2 ' fill='none' stroke='#E0F2FE' stroke-width='2' stroke-linecap='round' opacity='0.7'/>
        </g>

