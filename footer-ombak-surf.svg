        <g style='animation: ombakDriftFront 9s linear infinite;'>
            <!-- Main Wave Body -->
            <path d='M -150.0 175 L -150.0 108.0 C -79.2 118.0, -14.0 90.0, 42.7 71.2 C 65.3 60.8, 93.7 67.2, 85.2 86.0 C 76.7 100.0, 105.0 112.0, 133.3 108.0  C 204.2 118.0, 269.3 90.0, 326.0 71.2 C 348.7 60.8, 377.0 67.2, 368.5 86.0 C 360.0 100.0, 388.3 112.0, 416.7 108.0  C 487.5 118.0, 552.7 90.0, 609.3 71.2 C 632.0 60.8, 660.3 67.2, 651.8 86.0 C 643.3 100.0, 671.7 112.0, 700.0 108.0  C 770.8 118.0, 836.0 90.0, 892.7 71.2 C 915.3 60.8, 943.7 67.2, 935.2 86.0 C 926.7 100.0, 955.0 112.0, 983.3 108.0  C 1054.2 118.0, 1119.3 90.0, 1176.0 71.2 C 1198.7 60.8, 1227.0 67.2, 1218.5 86.0 C 1210.0 100.0, 1238.3 112.0, 1266.7 108.0  C 1337.5 118.0, 1402.7 90.0, 1459.3 71.2 C 1482.0 60.8, 1510.3 67.2, 1501.8 86.0 C 1493.3 100.0, 1521.7 112.0, 1550.0 108.0  C 1620.8 118.0, 1686.0 90.0, 1742.7 71.2 C 1765.3 60.8, 1793.7 67.2, 1785.2 86.0 C 1776.7 100.0, 1805.0 112.0, 1833.3 108.0  C 1904.2 118.0, 1969.3 90.0, 2026.0 71.2 C 2048.7 60.8, 2077.0 67.2, 2068.5 86.0 C 2060.0 100.0, 2088.3 112.0, 2116.7 108.0  L 2116.7 175 Z' fill='url(#oceanFrontGrad)'/>

            <!-- Thick White Foam Crest Curling Lip -->
            <path d='M 5.8 82.0 C 42.7 70.0, 65.3 59.2, 93.7 66.4 C 88.0 80.0, 82.3 92.0, 93.7 100.0  M 289.2 82.0 C 326.0 70.0, 348.7 59.2, 377.0 66.4 C 371.3 80.0, 365.7 92.0, 377.0 100.0  M 572.5 82.0 C 609.3 70.0, 632.0 59.2, 660.3 66.4 C 654.7 80.0, 649.0 92.0, 660.3 100.0  M 855.8 82.0 C 892.7 70.0, 915.3 59.2, 943.7 66.4 C 938.0 80.0, 932.3 92.0, 943.7 100.0  M 1139.2 82.0 C 1176.0 70.0, 1198.7 59.2, 1227.0 66.4 C 1221.3 80.0, 1215.7 92.0, 1227.0 100.0  M 1422.5 82.0 C 1459.3 70.0, 1482.0 59.2, 1510.3 66.4 C 1504.7 80.0, 1499.0 92.0, 1510.3 100.0  M 1705.8 82.0 C 1742.7 70.0, 1765.3 59.2, 1793.7 66.4 C 1788.0 80.0, 1782.3 92.0, 1793.7 100.0  M 1989.2 82.0 C 2026.0 70.0, 2048.7 59.2, 2077.0 66.4 C 2071.3 80.0, 2065.7 92.0, 2077.0 100.0 ' fill='none' stroke='#FFFFFF' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/>

            <!-- Secondary Sea Foam Details & Rip Currents -->
            <path d='M 5.8 82.0 C 42.7 70.0, 65.3 59.2, 93.7 66.4 C 88.0 80.0, 82.3 92.0, 93.7 100.0  M 289.2 82.0 C 326.0 70.0, 348.7 59.2, 377.0 66.4 C 371.3 80.0, 365.7 92.0, 377.0 100.0  M 572.5 82.0 C 609.3 70.0, 632.0 59.2, 660.3 66.4 C 654.7 80.0, 649.0 92.0, 660.3 100.0  M 855.8 82.0 C 892.7 70.0, 915.3 59.2, 943.7 66.4 C 938.0 80.0, 932.3 92.0, 943.7 100.0  M 1139.2 82.0 C 1176.0 70.0, 1198.7 59.2, 1227.0 66.4 C 1221.3 80.0, 1215.7 92.0, 1227.0 100.0  M 1422.5 82.0 C 1459.3 70.0, 1482.0 59.2, 1510.3 66.4 C 1504.7 80.0, 1499.0 92.0, 1510.3 100.0  M 1705.8 82.0 C 1742.7 70.0, 1765.3 59.2, 1793.7 66.4 C 1788.0 80.0, 1782.3 92.0, 1793.7 100.0  M 1989.2 82.0 C 2026.0 70.0, 2048.7 59.2, 2077.0 66.4 C 2071.3 80.0, 2065.7 92.0, 2077.0 100.0 ' fill='none' stroke='#BAE6FD' stroke-width='7' stroke-linecap='round' opacity='0.4'/>

            <!-- Sea Spray Droplets flying off the crest -->
            <g style='animation: sprayPulse 2.5s ease-in-out infinite;'>
                <circle cx='95' cy='62' r='2' fill='#FFFFFF'/>
                <circle cx='105' cy='58' r='1.5' fill='#FFFFFF'/>
                <circle cx='378' cy='62' r='2' fill='#FFFFFF'/>
                <circle cx='388' cy='58' r='1.5' fill='#FFFFFF'/>
                <circle cx='661' cy='62' r='2' fill='#FFFFFF'/>
                <circle cx='671' cy='58' r='1.5' fill='#FFFFFF'/>
                <circle cx='944' cy='62' r='2' fill='#FFFFFF'/>
            </g>
        </g>
    </g>
</svg>