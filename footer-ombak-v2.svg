<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 850 165' width='850' height='165' fill='none'>
    <style>
        @keyframes rollFront {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850.00px); }
        }
        @keyframes rollMid {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850.00px); }
        }
        @keyframes rollDeep {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850.00px); }
        }
        @keyframes sprayShimmer {
            0%, 100% { opacity: 0.7; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-3px) scale(1.2); }
        }
        .footer-quote {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            font-style: italic;
            font-weight: 600;
            font-size: 15.5px;
            letter-spacing: 0.4px;
            fill: #0284C7;
        }
        @media (prefers-color-scheme: dark) {
            .footer-quote {
                fill: #38BDF8;
            }
        }
    </style>

    <defs>
        <!-- Ocean Depths Gradients -->
        <linearGradient id='oceanAbyss' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#022642'/>
            <stop offset='50%' stop-color='#035286'/>
            <stop offset='100%' stop-color='#026FA8'/>
        </linearGradient>

        <linearGradient id='oceanMid' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#026AA7'/>
            <stop offset='50%' stop-color='#0284C7'/>
            <stop offset='100%' stop-color='#0EA5E9'/>
        </linearGradient>

        <linearGradient id='oceanBarrel' x1='0%' y1='0%' x2='100%' y2='0%'>
            <stop offset='0%' stop-color='#0277B5'/>
            <stop offset='40%' stop-color='#0098C7'/>
            <stop offset='80%' stop-color='#06B6D4'/>
            <stop offset='100%' stop-color='#67E8F9'/>
        </linearGradient>

        <clipPath id='footerClip'>
            <rect width='850' height='165' rx='8'/>
        </clipPath>
    </defs>

    <!-- Centered High-Contrast Quote -->
    <text x='425' y='30' text-anchor='middle' class='footer-quote'>
        “Keep building, stay curious, and never stop learning.”
    </text>

    <g clip-path='url(#footerClip)'>
        <!-- LAYER 1: Deep Ocean Tide Swell (24s cycle) -->
        <g style='animation: rollDeep 24s linear infinite;'>
            <path d='M -80.0 175 L -80.0 98.0 C 5.0 88.2, 75.8 73.4, 129.7 67.8 C 152.3 65.8, 175.0 75.0, 163.7 88.2 C 158.0 95.8, 183.5 101.4, 203.3 98.0  C 288.3 88.2, 359.2 73.4, 413.0 67.8 C 435.7 65.8, 458.3 75.0, 447.0 88.2 C 441.3 95.8, 466.8 101.4, 486.7 98.0  C 571.7 88.2, 642.5 73.4, 696.3 67.8 C 719.0 65.8, 741.7 75.0, 730.3 88.2 C 724.7 95.8, 750.2 101.4, 770.0 98.0  C 855.0 88.2, 925.8 73.4, 979.7 67.8 C 1002.3 65.8, 1025.0 75.0, 1013.7 88.2 C 1008.0 95.8, 1033.5 101.4, 1053.3 98.0  C 1138.3 88.2, 1209.2 73.4, 1263.0 67.8 C 1285.7 65.8, 1308.3 75.0, 1297.0 88.2 C 1291.3 95.8, 1316.8 101.4, 1336.7 98.0  C 1421.7 88.2, 1492.5 73.4, 1546.3 67.8 C 1569.0 65.8, 1591.7 75.0, 1580.3 88.2 C 1574.7 95.8, 1600.2 101.4, 1620.0 98.0  C 1705.0 88.2, 1775.8 73.4, 1829.7 67.8 C 1852.3 65.8, 1875.0 75.0, 1863.7 88.2 C 1858.0 95.8, 1883.5 101.4, 1903.3 98.0  C 1988.3 88.2, 2059.2 73.4, 2113.0 67.8 C 2135.7 65.8, 2158.3 75.0, 2147.0 88.2 C 2141.3 95.8, 2166.8 101.4, 2186.7 98.0  L 2186.7 175 Z' fill='url(#oceanAbyss)' opacity='0.85'/>
        </g>

        <!-- LAYER 2: Rolling Mid-Ocean Swell with Froth Lip (15s cycle) -->
        <g style='animation: rollMid 15s linear infinite;'>
            <path d='M -265.0 175 L -265.0 105.0 C -185.7 110.4, -123.3 85.2, -66.7 69.7 C -44.0 63.6, -15.7 71.9, -27.0 88.8 C -32.7 100.7, -4.3 108.6, 18.3 105.0  C 97.7 110.4, 160.0 85.2, 216.7 69.7 C 239.3 63.6, 267.7 71.9, 256.3 88.8 C 250.7 100.7, 279.0 108.6, 301.7 105.0  C 381.0 110.4, 443.3 85.2, 500.0 69.7 C 522.7 63.6, 551.0 71.9, 539.7 88.8 C 534.0 100.7, 562.3 108.6, 585.0 105.0  C 664.3 110.4, 726.7 85.2, 783.3 69.7 C 806.0 63.6, 834.3 71.9, 823.0 88.8 C 817.3 100.7, 845.7 108.6, 868.3 105.0  C 947.7 110.4, 1010.0 85.2, 1066.7 69.7 C 1089.3 63.6, 1117.7 71.9, 1106.3 88.8 C 1100.7 100.7, 1129.0 108.6, 1151.7 105.0  C 1231.0 110.4, 1293.3 85.2, 1350.0 69.7 C 1372.7 63.6, 1401.0 71.9, 1389.7 88.8 C 1384.0 100.7, 1412.3 108.6, 1435.0 105.0  C 1514.3 110.4, 1576.7 85.2, 1633.3 69.7 C 1656.0 63.6, 1684.3 71.9, 1673.0 88.8 C 1667.3 100.7, 1695.7 108.6, 1718.3 105.0  C 1797.7 110.4, 1860.0 85.2, 1916.7 69.7 C 1939.3 63.6, 1967.7 71.9, 1956.3 88.8 C 1950.7 100.7, 1979.0 108.6, 2001.7 105.0  L 2001.7 175 Z' fill='url(#oceanMid)' opacity='0.9'/>
            <!-- Sea Froth Line -->
            <path d='M -123.3 85.2 C -80.8 68.3, -55.3 57.5, -15.7 64.7 C -24.2 80.5, -32.7 93.5, -21.3 101.4  M 160.0 85.2 C 202.5 68.3, 228.0 57.5, 267.7 64.7 C 259.2 80.5, 250.7 93.5, 262.0 101.4  M 443.3 85.2 C 485.8 68.3, 511.3 57.5, 551.0 64.7 C 542.5 80.5, 534.0 93.5, 545.3 101.4  M 726.7 85.2 C 769.2 68.3, 794.7 57.5, 834.3 64.7 C 825.8 80.5, 817.3 93.5, 828.7 101.4  M 1010.0 85.2 C 1052.5 68.3, 1078.0 57.5, 1117.7 64.7 C 1109.2 80.5, 1100.7 93.5, 1112.0 101.4  M 1293.3 85.2 C 1335.8 68.3, 1361.3 57.5, 1401.0 64.7 C 1392.5 80.5, 1384.0 93.5, 1395.3 101.4  M 1576.7 85.2 C 1619.2 68.3, 1644.7 57.5, 1684.3 64.7 C 1675.8 80.5, 1667.3 93.5, 1678.7 101.4  M 1860.0 85.2 C 1902.5 68.3, 1928.0 57.5, 1967.7 64.7 C 1959.2 80.5, 1950.7 93.5, 1962.0 101.4 ' fill='none' stroke='#BAE6FD' stroke-width='2.5' stroke-linecap='round' opacity='0.75'/>
        </g>

        <!-- LAYER 3: Crashing Barrel Surf with Curling Foam Lip (9s fast rolling cycle) -->
        <g style='animation: rollFront 9s linear infinite;'>
            <!-- Main Wave Barrel -->
            <path d='M -150.0 175 L -150.0 112.0 C -87.7 125.5, -25.3 91.8, 34.2 68.8 C 59.7 54.4, 99.3 63.4, 88.0 89.5 C 76.7 105.2, 105.0 117.4, 133.3 112.0  C 195.7 125.5, 258.0 91.8, 317.5 68.8 C 343.0 54.4, 382.7 63.4, 371.3 89.5 C 360.0 105.2, 388.3 117.4, 416.7 112.0  C 479.0 125.5, 541.3 91.8, 600.8 68.8 C 626.3 54.4, 666.0 63.4, 654.7 89.5 C 643.3 105.2, 671.7 117.4, 700.0 112.0  C 762.3 125.5, 824.7 91.8, 884.2 68.8 C 909.7 54.4, 949.3 63.4, 938.0 89.5 C 926.7 105.2, 955.0 117.4, 983.3 112.0  C 1045.7 125.5, 1108.0 91.8, 1167.5 68.8 C 1193.0 54.4, 1232.7 63.4, 1221.3 89.5 C 1210.0 105.2, 1238.3 117.4, 1266.7 112.0  C 1329.0 125.5, 1391.3 91.8, 1450.8 68.8 C 1476.3 54.4, 1516.0 63.4, 1504.7 89.5 C 1493.3 105.2, 1521.7 117.4, 1550.0 112.0  C 1612.3 125.5, 1674.7 91.8, 1734.2 68.8 C 1759.7 54.4, 1799.3 63.4, 1788.0 89.5 C 1776.7 105.2, 1805.0 117.4, 1833.3 112.0  C 1895.7 125.5, 1958.0 91.8, 2017.5 68.8 C 2043.0 54.4, 2082.7 63.4, 2071.3 89.5 C 2060.0 105.2, 2088.3 117.4, 2116.7 112.0  L 2116.7 175 Z' fill='url(#oceanBarrel)'/>

            <!-- Thick White Sea Foam Lip Overhang -->
            <path d='M -8.3 87.2 C 34.2 66.1, 59.7 52.6, 99.3 61.6 C 90.8 81.4, 82.3 97.6, 93.7 107.5  M 275.0 87.2 C 317.5 66.1, 343.0 52.6, 382.7 61.6 C 374.2 81.4, 365.7 97.6, 377.0 107.5  M 558.3 87.2 C 600.8 66.1, 626.3 52.6, 666.0 61.6 C 657.5 81.4, 649.0 97.6, 660.3 107.5  M 841.7 87.2 C 884.2 66.1, 909.7 52.6, 949.3 61.6 C 940.8 81.4, 932.3 97.6, 943.7 107.5  M 1125.0 87.2 C 1167.5 66.1, 1193.0 52.6, 1232.7 61.6 C 1224.2 81.4, 1215.7 97.6, 1227.0 107.5  M 1408.3 87.2 C 1450.8 66.1, 1476.3 52.6, 1516.0 61.6 C 1507.5 81.4, 1499.0 97.6, 1510.3 107.5  M 1691.7 87.2 C 1734.2 66.1, 1759.7 52.6, 1799.3 61.6 C 1790.8 81.4, 1782.3 97.6, 1793.7 107.5  M 1975.0 87.2 C 2017.5 66.1, 2043.0 52.6, 2082.7 61.6 C 2074.2 81.4, 2065.7 97.6, 2077.0 107.5 ' fill='none' stroke='#FFFFFF' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/>

            <!-- Sea Foam Splash Froth Under Lip -->
            <path d='M -8.3 87.2 C 34.2 66.1, 59.7 52.6, 99.3 61.6 C 90.8 81.4, 82.3 97.6, 93.7 107.5  M 275.0 87.2 C 317.5 66.1, 343.0 52.6, 382.7 61.6 C 374.2 81.4, 365.7 97.6, 377.0 107.5  M 558.3 87.2 C 600.8 66.1, 626.3 52.6, 666.0 61.6 C 657.5 81.4, 649.0 97.6, 660.3 107.5  M 841.7 87.2 C 884.2 66.1, 909.7 52.6, 949.3 61.6 C 940.8 81.4, 932.3 97.6, 943.7 107.5  M 1125.0 87.2 C 1167.5 66.1, 1193.0 52.6, 1232.7 61.6 C 1224.2 81.4, 1215.7 97.6, 1227.0 107.5  M 1408.3 87.2 C 1450.8 66.1, 1476.3 52.6, 1516.0 61.6 C 1507.5 81.4, 1499.0 97.6, 1510.3 107.5  M 1691.7 87.2 C 1734.2 66.1, 1759.7 52.6, 1799.3 61.6 C 1790.8 81.4, 1782.3 97.6, 1793.7 107.5  M 1975.0 87.2 C 2017.5 66.1, 2043.0 52.6, 2082.7 61.6 C 2074.2 81.4, 2065.7 97.6, 2077.0 107.5 ' fill='none' stroke='#E0F2FE' stroke-width='8' stroke-linecap='round' opacity='0.4'/>

            <!-- Foam trails / Rip currents washing down wave face -->
            <path d='M 70 120 Q 115 110 160 114' stroke='#FFFFFF' stroke-width='1.5' stroke-dasharray='7 5' opacity='0.65'/>
            <path d='M 353 120 Q 398 110 443 114' stroke='#FFFFFF' stroke-width='1.5' stroke-dasharray='7 5' opacity='0.65'/>
            <path d='M 636 120 Q 681 110 726 114' stroke='#FFFFFF' stroke-width='1.5' stroke-dasharray='7 5' opacity='0.65'/>
            <path d='M 919 120 Q 964 110 1009 114' stroke='#FFFFFF' stroke-width='1.5' stroke-dasharray='7 5' opacity='0.65'/>

            <!-- Spray Droplets Flying from Curling Crests -->
            <g style='animation: sprayShimmer 2.5s ease-in-out infinite;'>
                <circle cx='95' cy='52' r='2.5' fill='#FFFFFF'/>
                <circle cx='106' cy='46' r='1.8' fill='#FFFFFF'/>
                <circle cx='118' cy='55' r='1.2' fill='#FFFFFF'/>

                <circle cx='378' cy='52' r='2.5' fill='#FFFFFF'/>
                <circle cx='389' cy='46' r='1.8' fill='#FFFFFF'/>
                <circle cx='401' cy='55' r='1.2' fill='#FFFFFF'/>

                <circle cx='661' cy='52' r='2.5' fill='#FFFFFF'/>
                <circle cx='672' cy='46' r='1.8' fill='#FFFFFF'/>
                <circle cx='684' cy='55' r='1.2' fill='#FFFFFF'/>

                <circle cx='944' cy='52' r='2.5' fill='#FFFFFF'/>
                <circle cx='955' cy='46' r='1.8' fill='#FFFFFF'/>
            </g>
        </g>
    </g>
</svg>