<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 850 200' width='850' height='200' fill='none'>
    <style>
        @keyframes driftBack {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850px); }
        }
        @keyframes driftMid {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850px); }
        }
        @keyframes driftFront {
            0% { transform: translateX(0); }
            100% { transform: translateX(-850px); }
        }
        @keyframes textBreathe {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 1; }
        }
        .banner-name {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: -0.3px;
            fill: #FFFFFF;
            filter: drop-shadow(0 2px 8px rgba(2, 44, 90, 0.4));
        }
        .banner-role {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
            font-weight: 400;
            font-size: 15.5px;
            letter-spacing: 0.6px;
            fill: #F0F9FF;
            filter: drop-shadow(0 1px 4px rgba(2, 44, 90, 0.45));
        }
    </style>

    <defs>
        <!-- Daytime Sky Gradient -->
        <linearGradient id='skyDay' x1='0%' y1='0%' x2='100%' y2='100%'>
            <stop offset='0%' stop-color='#0284C7'/>
            <stop offset='45%' stop-color='#0EA5E9'/>
            <stop offset='100%' stop-color='#38BDF8'/>
        </linearGradient>

        <!-- Volumetric Cloud Gradients -->
        <linearGradient id='cloudVol1' x1='0%' y1='0%' x2='0%' y2='100%'>
            <stop offset='0%' stop-color='#FFFFFF'/>
            <stop offset='70%' stop-color='#E0F2FE'/>
            <stop offset='100%' stop-color='#BAE6FD' stop-opacity='0.75'/>
        </linearGradient>

        <linearGradient id='cloudVol2' x1='0%' y1='0%' x2='0%' y2='100%'>
            <stop offset='0%' stop-color='#FFFFFF' stop-opacity='0.95'/>
            <stop offset='65%' stop-color='#F0F9FF' stop-opacity='0.85'/>
            <stop offset='100%' stop-color='#E0F2FE' stop-opacity='0.6'/>
        </linearGradient>

        <linearGradient id='cloudVolBack' x1='0%' y1='0%' x2='0%' y2='100%'>
            <stop offset='0%' stop-color='#BAE6FD' stop-opacity='0.5'/>
            <stop offset='100%' stop-color='#E0F2FE' stop-opacity='0.25'/>
        </linearGradient>

        <!-- Cloud Shape 1 (Large Cumulus) -->
        <g id='cloudLarge'>
            <path d='M 40 110 C 40 85, 65 70, 95 78 C 115 52, 160 42, 195 65 C 220 46, 268 50, 288 78 C 318 78, 336 96, 332 116 C 342 130, 328 148, 310 148 L 58 148 C 38 148, 28 132, 40 110 Z' 
                  fill='url(#cloudVol1)'/>
            <!-- Top highlight dome -->
            <ellipse cx='195' cy='75' rx='55' ry='30' fill='#FFFFFF' fill-opacity='0.35'/>
            <ellipse cx='115' cy='90' rx='35' ry='22' fill='#FFFFFF' fill-opacity='0.25'/>
        </g>

        <!-- Cloud Shape 2 (Medium Fluffy) -->
        <g id='cloudMed'>
            <path d='M 30 85 C 30 65, 52 55, 72 64 C 88 45, 122 40, 148 58 C 166 44, 198 48, 212 70 C 230 70, 244 84, 240 98 C 248 108, 236 122, 222 122 L 44 122 C 30 122, 22 110, 30 85 Z' 
                  fill='url(#cloudVol2)'/>
            <ellipse cx='148' cy='66' rx='42' ry='24' fill='#FFFFFF' fill-opacity='0.3'/>
        </g>

        <!-- Cloud Shape 3 (Soft Distant Cloud) -->
        <g id='cloudBack'>
            <path d='M 30 70 C 30 52, 48 44, 65 52 C 78 36, 108 32, 128 46 C 144 36, 170 38, 182 56 C 196 56, 208 68, 204 80 C 212 88, 202 100, 190 100 L 40 100 C 28 100, 22 90, 30 70 Z' 
                  fill='url(#cloudVolBack)'/>
        </g>

        <!-- Rounded top clip -->
        <clipPath id='skyBounds'>
            <rect width='850' height='200' rx='8'/>
        </clipPath>
    </defs>

    <g clip-path='url(#skyBounds)'>
        <!-- Sky Canvas -->
        <rect width='850' height='200' fill='url(#skyDay)'/>

        <!-- LAYER 1: Distant Background Clouds (Slow parallax 48s) -->
        <g style='animation: driftBack 48s linear infinite;'>
            <!-- Set 1 -->
            <use href='#cloudBack' x='50' y='-15'/>
            <use href='#cloudBack' x='340' y='-5'/>
            <use href='#cloudBack' x='620' y='-20'/>
            <!-- Set 2 (Exact duplicate at +850px for seamless loop) -->
            <use href='#cloudBack' x='900' y='-15'/>
            <use href='#cloudBack' x='1190' y='-5'/>
            <use href='#cloudBack' x='1470' y='-20'/>
        </g>

        <!-- LAYER 2: Midground Fluffy Cumulus Clouds (Medium parallax 28s) -->
        <g style='animation: driftMid 28s linear infinite;'>
            <!-- Set 1 -->
            <use href='#cloudMed' x='-40' y='30'/>
            <use href='#cloudMed' x='260' y='42'/>
            <use href='#cloudMed' x='570' y='25'/>
            <!-- Set 2 (Exact duplicate at +850px for seamless loop) -->
            <use href='#cloudMed' x='810' y='30'/>
            <use href='#cloudMed' x='1110' y='42'/>
            <use href='#cloudMed' x='1420' y='25'/>
        </g>

        <!-- LAYER 3: Foreground Billowing Clouds along bottom (Fast parallax 18s) -->
        <g style='animation: driftFront 18s linear infinite;'>
            <!-- Set 1 -->
            <use href='#cloudLarge' x='-80' y='65'/>
            <use href='#cloudLarge' x='200' y='60'/>
            <use href='#cloudLarge' x='500' y='68'/>
            <!-- Set 2 (Exact duplicate at +850px for seamless loop) -->
            <use href='#cloudLarge' x='770' y='65'/>
            <use href='#cloudLarge' x='1050' y='60'/>
            <use href='#cloudLarge' x='1350' y='68'/>
        </g>

        <!-- Bottom cloud bank wave contour that softens the edge -->
        <path d='M 0 200 L 0 162 
                 Q 50 135 110 156 
                 Q 175 125 240 152 
                 Q 305 130 375 158 
                 Q 440 128 510 155 
                 Q 580 132 650 160 
                 Q 720 128 785 156 
                 Q 825 142 850 165 L 850 200 Z' 
              fill='#FFFFFF' fill-opacity='0.85'/>

        <!-- Centered Clean Typography -->
        <g style='animation: textBreathe 6s ease-in-out infinite;'>
            <text x='425' y='76' text-anchor='middle' class='banner-name'>
                Johan Kevin Kenneth Hutagalung
            </text>
            <text x='425' y='108' text-anchor='middle' class='banner-role'>
                Fullstack Developer | Informatics Engineering
            </text>
        </g>
    </g>
</svg>